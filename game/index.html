<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERDEEP — a lantern lit against the abyss</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04121a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the line a screen reader announces. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="EMBERDEEP: steer the lantern keeper with W A S D, aim with the mouse, hold the mouse button or Space to fire light bolts, Shift to dash, and survive twelve waves of the deep."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
